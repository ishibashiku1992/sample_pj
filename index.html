<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODOアプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="new-form" class="new-form" autocomplete="off">
      <input id="new-input" type="text" placeholder="やることを入力して Enter" aria-label="新しいTODO" maxlength="200" required>
      <button type="submit">追加</button>
    </form>

    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="empty">TODOはありません</p>

    <footer id="footer" class="footer">
      <span id="count"></span>
      <div class="filters" role="group" aria-label="絞り込み">
        <button type="button" data-filter="all">すべて</button>
        <button type="button" data-filter="active">未完了</button>
        <button type="button" data-filter="done">完了</button>
      </div>
      <button type="button" id="clear-done" class="link">完了済みを削除</button>
    </footer>

    <p class="hint">ダブルクリックで編集できます</p>
  </main>

  <template id="item-template">
    <li class="item">
      <input type="checkbox" class="toggle" aria-label="完了">
      <span class="text"></span>
      <button type="button" class="delete" aria-label="削除">×</button>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
